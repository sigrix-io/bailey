[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bailey"
version = "0.0.1"
description = "An open-source AI assistant that runs ready-made solutions on your own machine, with your own AI key. This first release ships `bailey doctor`."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Sigrix" }]
keywords = ["ai", "assistant", "agent", "mcp", "agent-skills", "rag", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# The app's own: Starlette on uvicorn serves the page on loopback, keyring
# reaches the OS keychain, and cryptography encrypts the key file where there is
# no keychain. `bailey doctor` still imports only the standard library (its
# keychain check imports keyring when it runs, and reports one it cannot load).
#
# The agent core is PydanticAI and the two provider SDKs, pinned exactly, at the
# versions S1's spike measured (docs/spikes/0001-agent-core-and-local-index.md):
# its API moves between minor versions, so a bump lands only once the contract
# tests in tests/test_agent_contract.py and tests/test_tool_contract.py pass on
# it. The tool host runs a solution's MCP servers through PydanticAI's MCP
# toolset, which is built on FastMCP's client and the official MCP SDK, pinned
# exactly at the spike's versions too.
#
# Knowledge is S1's stack, pinned at the versions it measured: MarkItDown converts
# documents, fastembed embeds them on this computer through onnxruntime, and numpy
# searches the vectors. Each loads only when a document needs it. numpy 2.5 needs
# Python 3.12, so Python 3.11 takes 2.4.6, the last numpy that installs there; what
# the search uses of numpy is the same in both, and CI runs the suite on each.
dependencies = [
    "starlette>=1.10,<2",
    "uvicorn>=0.54",
    "keyring>=25.7",
    "cryptography>=45",
    "pydantic-ai-slim[anthropic,openai,mcp]==2.56.0",
    "anthropic==1.13.0",
    "openai==3.31.0",
    "fastmcp-slim==4.1.0",
    "mcp==2.3.0",
    "markitdown[pdf,docx]==0.1.8",
    "fastembed==0.9.0",
    "onnxruntime==1.31.0",
    "numpy==2.5.4; python_version >= '3.12'",
    "numpy==2.4.6; python_version < '3.12'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy==2.4.0",
    # Validates the solution format's schema and its case table in the tests.
    "jsonschema>=4.23",
    # Starlette's TestClient, which drives the app in the tests.
    "httpx2>=2.16",
]

[project.scripts]
bailey = "bailey.cli:main"

[project.urls]
Homepage = "https://github.com/sigrix-io/bailey"
Issues = "https://github.com/sigrix-io/bailey/issues"
Changelog = "https://github.com/sigrix-io/bailey/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/bailey"]

[tool.hatch.build.targets.sdist]
include = ["src/bailey", "schemas", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]
# The pin guard reads .github/workflows, which the sdist does not carry: it
# checks the repository, not the package.
exclude = ["tests/test_workflow_pins.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# S105 and S106: the tests' keys, passphrases and tokens are made up for them.
"tests/*" = ["S101", "S603", "S105", "S106"]

# py.typed ships in the wheel, which tells every consumer's type checker to
# trust these annotations, so they are checked as strictly as the other Sigrix
# packages check theirs.
[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/bailey"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
