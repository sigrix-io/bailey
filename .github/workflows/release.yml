name: Release

# Trusted publishing: PyPI trusts this repository's `release.yml` in the
# `pypi` environment, so no API token is stored anywhere and nothing here
# reads a secret. Both sides of that trust have to exist before the first
# tag — the publisher on PyPI and the environment in this repository's
# settings. VERSIONING.md § Releasing has the two of them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancelled: a run cancelled mid-upload can leave a release half-landed,
# and a PyPI version number can never be reused.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A fork can push a tag to itself; it must not build what this
    # repository's trust policy would then be asked to publish.
    if: github.repository == 'sigrix-io/bailey'
    steps:
      - uses: sigrix-io/actions/setup-python-project@765103f1c9d89e019dcaea72a78eed2577b30ae1 # v1.0.0
        with:
          python-version: "3.12"
          install: build
      - name: Build sdist and wheel
        run: python -m build
      - name: The tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      # The checks the verify job runs against PyPI after the upload, run here
      # against the wheel before it. A PyPI version can never be reused, so this
      # is the cheap place to find a stale __version__ or a missing py.typed.
      # From /tmp, so nothing in the checkout can satisfy the import.
      - name: The wheel installs, reports the tag's version and carries py.typed
        run: |
          set -euo pipefail
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --quiet dist/*.whl
          cd /tmp
          VERSION="${GITHUB_REF_NAME#v}" /tmp/wheelcheck/bin/python - <<'PY'
          import os
          import pathlib

          import bailey

          root = pathlib.Path(bailey.__file__).parent
          assert "site-packages" in str(root), root
          assert bailey.__version__ == os.environ["VERSION"], bailey.__version__
          assert (root / "py.typed").exists(), "py.typed is not in the wheel"
          print("bailey", bailey.__version__, "installs and carries py.typed")
          PY
      # What uvx, pipx and pip will find for this version on each computer the README names,
      # from the index as it is now (scripts/check_wheels.py), as CI's wheels job checks it. A
      # dependency can drop a computer between a merge and a tag, and once uploaded the version
      # is spent. uv is the version the image pins, read from the Dockerfile.
      - name: uv, at the image's pin
        run: python -m pip install "uv==$(sed -n 's/^ARG UV_VERSION=//p' Dockerfile)"
      - name: Every computer is as the README says
        run: python scripts/check_wheels.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # An upload that succeeds is not the same as a package anyone can install,
  # and the two look identical from the publish step. Install by name from the
  # index the upload just went to, the way `uvx bailey` does.
  # On a Mac as well as Linux: an installer settles for different packages on each, and a Mac is
  # where Bailey once went missing with no error. macos-latest has an Apple chip on a macOS the
  # README covers. Windows waits for the shared action, which installs into a venv's bin/.
  verify:
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Waits out the index, installs that exact version, and checks it is that
      # version, from site-packages, carrying py.typed. It waits up to twenty minutes,
      # twice the ten PyPI's CDN caches the index page for (`max-age=600`). On 0.1.3's
      # release the Linux runner was handed the page from before the upload for all of
      # the action's default ten (40 attempts, 15 seconds apart), and the run failed
      # with the version published and installed on the Mac. A prompt index ends the
      # wait at the first attempt.
      - id: published
        uses: sigrix-io/actions/verify-published-package@765103f1c9d89e019dcaea72a78eed2577b30ae1 # v1.0.0
        with:
          package: bailey
          version: ${{ steps.tag.outputs.version }}
          import-name: bailey
          attempts: "80"
          interval: "15"

      # What this package claims about itself, against the environment the
      # action installed into: the `bailey` command is in the published
      # distribution, and answers with this version.
      - name: The published console script answers with this version
        env:
          PUBLISHED_PYTHON: ${{ steps.published.outputs.python }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          cd /tmp
          said="$("$(dirname "$PUBLISHED_PYTHON")/bailey" --version)"
          echo "$said"
          test "$said" = "bailey $VERSION"

      # What `uvx bailey` gives a person: the app opens, at the address it prints, with
      # its token, and stops cleanly. The script is the one CI runs against the image;
      # nothing else of the checkout is used, and the app runs from /tmp.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/check_launch.py
          sparse-checkout-cone-mode: false
          path: checkout
      - name: The published app opens on a clean machine
        env:
          PUBLISHED_PYTHON: ${{ steps.published.outputs.python }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/checkout/scripts/check_launch.py"
          cd /tmp
          python3 "$script" --expect-version "$VERSION" \
            --command "$(dirname "$PUBLISHED_PYTHON")/bailey" --no-browser --port 18123
