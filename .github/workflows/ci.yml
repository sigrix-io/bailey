name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      # The keychain round trip writes to the runner's own keychain, which the macOS and
      # Windows runners have and the Linux ones lack (tests/test_real_keychain.py).
      BAILEY_TEST_REAL_KEYCHAIN: ${{ matrix.os == 'ubuntu-latest' && '0' || '1' }}
      # The search model is fetched from Hugging Face and searched with once, on one job:
      # every other test uses a stand-in, so this is what notices a fastembed or
      # onnxruntime bump that no longer loads it (tests/test_knowledge.py).
      BAILEY_TEST_REAL_EMBEDDINGS: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && '1' || '0' }}
      # So is an app's environment, with the real CrewAI, built from PyPI and run once
      # (tests/test_apps_real.py); this runner has no uv, so it is built with venv and pip.
      BAILEY_TEST_REAL_CREWAI: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # The doctor reads the machine it runs on, so it runs on the other two
        # systems a user has, once each.
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      # Checks out, installs the Python and pip-installs `-e .[dev]`, with the
      # upstream actions pinned once in sigrix-io/actions rather than here.
      - uses: sigrix-io/actions/setup-python-project@765103f1c9d89e019dcaea72a78eed2577b30ae1 # v1.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: ruff check . && ruff format --check .
      # The lessons are recorded with Pageant, pinned in lessons/requirements.txt, and their
      # pages are written on its core, which is the standard library's: that much is installed
      # for the lessons' tests, and the record extra (a browser, the voice) is not.
      - name: The lessons' recorder, without its record extra
        run: python -m pip install --no-deps -r lessons/requirements.txt
      - name: Test
        run: pytest -q
      - name: The console script answers
        run: bailey --version && bailey doctor

  # py.typed ships in the wheel, which tells every consumer's type checker to
  # trust these annotations. Strict, as pyproject.toml configures it.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: sigrix-io/actions/setup-python-project@765103f1c9d89e019dcaea72a78eed2577b30ae1 # v1.0.0
      - run: python -m mypy

  # The image image.yml publishes, built from this checkout on both architectures and
  # opened as a person opens it (scripts/check_launch.py): the page, the token, the Host
  # rule, the tools a solution's servers start with, the search model with the network
  # off, bailey doctor, and a clean stop. A GitHub runner is a clean machine.
  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: sigrix-io/actions/setup-python-project@765103f1c9d89e019dcaea72a78eed2577b30ae1 # v1.0.0
        with:
          python-version: "3.13"
          install: build
      - name: Build the wheel
        run: python -m build --wheel
      - name: Build the image
        run: docker build --tag bailey:ci .
      - name: Open the app in it
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python scripts/check_launch.py --image bailey:ci --expect-version "$version"

  # What uvx, pipx and pip find on each computer the README names (scripts/check_wheels.py):
  # a wheel for every package an installer picks where it says Bailey installs, and nothing
  # where it sends a computer to Docker. Resolves only, for each computer from this one
  # runner: nothing is installed. uv is the version the image pins, read from the Dockerfile.
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: sigrix-io/actions/setup-python-project@765103f1c9d89e019dcaea72a78eed2577b30ae1 # v1.0.0
        with:
          python-version: "3.13"
          install: ""
      - name: uv, at the image's pin
        run: python -m pip install "uv==$(sed -n 's/^ARG UV_VERSION=//p' Dockerfile)"
      - name: Every computer is as the README says
        run: python scripts/check_wheels.py

  # The aggregate gate. One check to require on main, so adding a job or an
  # operating system above does not mean editing the branch ruleset to match.
  ci-passed:
    if: always()
    needs: [test, types, image, wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
