<!doctype html>
<!--
  The terminal a lesson films (studio.py's terminal() and shell()). Each command is typed at the
  prompt, then run for real in a shell of its own, and what it prints arrives here line by line,
  as written, with only terminal control codes taken out; `clear` clears the screen.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Terminal</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #12141a; }
    body {
      display: flex;
      flex-direction: column;
      color: #e4e6eb;
      font: 17px/1.55 "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    .bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 16px;
      background: #22252d;
      border-bottom: 1px solid #2d313b;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f57; }
    .dot.amber { background: #febc2e; }
    .dot.green { background: #28c840; }
    .title { flex: 1; margin-right: 52px; text-align: center; color: #a3a9b6; font: 600 14px/1 Inter, system-ui, sans-serif; }
    #screen { flex: 1; overflow: hidden; padding: 18px 28px 150px; }
    .line { min-height: 1.55em; white-space: pre-wrap; overflow-wrap: anywhere; }
    .prompt { color: #7ee2a8; }
    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.15em;
      margin-left: 1px;
      vertical-align: -0.2em;
      background: #e4e6eb;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="bar">
    <span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span>
    <span class="title" id="title">Terminal</span>
  </div>
  <div id="screen"></div>
  <script>
    (() => {
      const screen = document.getElementById("screen");
      const CONTROL = /\x1b\[[0-9;?]*[A-Za-z]|\x1b[()][A-Z0-9]|\r/g;
      const CLEARS = /\x1b\[[23]?J|\x1bc/;
      let block = null;
      let typed = null;
      let cursor = null;
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const make = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };
      // The newest line stays in view, above where the captions are drawn.
      const follow = () => {
        screen.scrollTop = screen.scrollHeight;
      };
      window.__term = {
        title(text) {
          document.getElementById("title").textContent = text;
        },
        prompt(where) {
          block = make("div", "block");
          const line = make("div", "line cmd");
          line.append(make("span", "prompt", (where || "~") + " $ "));
          typed = make("span", "typed", "");
          cursor = make("span", "cursor");
          line.append(typed, cursor);
          block.append(line, make("div", "out"));
          screen.append(block);
          follow();
        },
        async type(text, delay) {
          for (const character of text) {
            typed.textContent += character;
            follow();
            await sleep(delay * (0.6 + Math.random() * 0.8));
          }
        },
        enter() {
          if (cursor) cursor.remove();
          cursor = null;
        },
        write(text) {
          if (CLEARS.test(text)) {
            screen.replaceChildren();
            block = null;
            return;
          }
          const out = block ? block.querySelector(".out") : screen;
          out.append(make("div", "line", text.replace(CONTROL, "")));
          follow();
        },
      };
    })();
  </script>
</body>
</html>
